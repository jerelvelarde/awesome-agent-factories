[project]
name = "software-development-factory"
version = "0.1.0"
description = "Software Development Factory — a deepagents-based agent factory that produces reviewed, tested pull requests."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
